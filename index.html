<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#120b1f">
<title>Outfit Builder</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; overflow: hidden; overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #fff; background: #120b1f;
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(ellipse at 20% 10%, #6d28d9 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, #db2777 0%, transparent 45%),
      radial-gradient(ellipse at 50% 90%, #0891b2 0%, transparent 50%),
      linear-gradient(165deg, #120b1f 0%, #0a0614 100%);
  }
  .app {
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  .sets-wrapper {
    flex: 1 1 auto;
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    min-height: 0;
  }
  .sets-wrapper::-webkit-scrollbar { display: none; }

  .set-page {
    flex: 0 0 100%;
    scroll-snap-align: center;
    display: flex;
    flex-direction: column;
    padding: 0.3rem 0.55rem 0.1rem;
    gap: 0.2rem;
    height: 100%;
    overflow: hidden;
  }

  .set-header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.15rem 0.2rem 0.25rem;
  }
  .set-name {
    font-size: 0.85rem;
    font-weight: 700;
    color: #fff;
  }
  .set-theme {
    font-size: 0.65rem;
    font-weight: 600;
    padding: 0.15rem 0.5rem;
    border-radius: 8px;
    background: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.8);
  }

  .slots-container {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 0.22rem;
    min-height: 0;
    overflow: hidden;
  }

  .slot {
    position: relative;
    background: rgba(255,255,255,0.06);
    border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 13px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  .slot.active {
    border-color: #4ade80;
    background: rgba(74,222,128,0.12);
  }
  .slot img {
    width: 100%; height: 100%;
    object-fit: contain;
    pointer-events: none;
  }
  .slot .placeholder {
    color: rgba(255,255,255,0.28);
    font-size: 0.72rem;
    font-weight: 500;
    text-align: center;
    padding: 0.25rem;
  }
  .slot .label {
    position: absolute; top: 4px; left: 6px;
    font-size: 0.55rem; font-weight: 600;
    color: rgba(255,255,255,0.45);
    background: rgba(0,0,0,0.5);
    padding: 0.08rem 0.3rem;
    border-radius: 5px;
    pointer-events: none;
  }
  .slot-arrows {
    position: absolute; bottom: 4px; left: 0; right: 0;
    display: none; justify-content: space-between;
    padding: 0 5px;
    pointer-events: none;
  }
  .slot.active .slot-arrows { display: flex; }
  .slot-arrows button {
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(0,0,0,0.75);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff; font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto;
  }

  .slot.flex-1 { flex: 1 1 0; }
  .slot.flex-2 { flex: 2 1 0; }
  .slot.thin   { flex: 0 0 8.5%; min-height: 34px; max-height: 48px; }

  .row {
    display: flex;
    gap: 0.22rem;
    min-height: 0;
  }
  .row.flex-1 { flex: 1 1 0; }
  .row.flex-2 { flex: 2 1 0; }
  .row.flex-3 { flex: 3 1 0; }

  .set-dots {
    flex: 0 0 auto;
    display: flex; justify-content: center; gap: 6px;
    padding: 0.1rem 0 0.05rem;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,0.25);
  }
  .dot.active { background: #4ade80; }

  .closet {
    flex: 0 0 auto;
    margin: 0.08rem 0.45rem 0.22rem;
    background: rgba(255,255,255,0.07);
    border-radius: 15px;
    padding: 0.32rem;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .closet-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 0.22rem; padding: 0 0.08rem;
  }
  .closet-title {
    font-size: 0.65rem; font-weight: 600;
    color: rgba(255,255,255,0.5);
  }
  .closet-actions {
    display: flex; gap: 0.25rem;
  }
  .closet-actions button {
    height: 27px; padding: 0 0.5rem;
    border-radius: 8px; font-size: 0.65rem; font-weight: 600;
    border: none; background: rgba(255,255,255,0.12); color: #fff;
  }
  .closet-actions button.green { background: #4ade80; color: #062; }
  .closet-actions button.blue  { background: #60a5fa; color: #fff; }
  .closet-actions button.purple { background: #a78bfa; color: #fff; }

  .cat-tabs {
    display: flex; gap: 0.2rem;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    margin-bottom: 0.22rem;
  }
  .cat-tabs::-webkit-scrollbar { display: none; }
  .cat-tab {
    flex: 0 0 auto;
    padding: 0.25rem 0.5rem;
    border-radius: 8px;
    font-size: 0.65rem; font-weight: 600;
    color: rgba(255,255,255,0.45);
    background: transparent; border: none;
  }
  .cat-tab.active {
    background: rgba(255,255,255,0.16);
    color: #fff;
  }
  .items-row {
    display: flex; gap: 0.25rem;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    min-height: 48px;
  }
  .items-row::-webkit-scrollbar { display: none; }
  .thumb {
    flex: 0 0 auto; width: 46px; height: 46px;
    border-radius: 10px;
    background: rgba(255,255,255,0.06);
    overflow: hidden; position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .thumb img { width: 100%; height: 100%; object-fit: contain; padding: 2px; }
  .thumb .del {
    position: absolute; top: 1px; right: 1px;
    width: 14px; height: 14px; border-radius: 50%;
    background: rgba(0,0,0,0.75); color: #fff;
    border: none; font-size: 0.48rem;
    display: flex; align-items: center; justify-content: center;
  }
  .add-thumb {
    flex: 0 0 auto; width: 46px; height: 46px;
    border-radius: 10px;
    border: 1.5px dashed rgba(255,255,255,0.28);
    background: rgba(255,255,255,0.04);
    color: #4ade80; font-size: 1.2rem;
    display: flex; align-items: center; justify-content: center;
  }

  /* Modals */
  .modal {
    position: fixed; inset: 0; z-index: 100;
    display: none; flex-direction: column;
    background: rgba(8,5,18,0.97);
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .modal.open { display: flex; }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.65rem 1rem;
  }
  .modal-header h3 { font-size: 1.02rem; font-weight: 600; }
  .modal-header button {
    height: 36px; padding: 0 0.85rem; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.1); color: #fff; font-weight: 600;
  }
  .batch-info {
    text-align: center; font-size: 0.78rem; color: #4ade80;
    font-weight: 600; padding: 0.15rem 0;
  }
  .preview-area {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 0.5rem 1.1rem; overflow: hidden; min-height: 0;
  }
  .preview-area img {
    max-width: 100%; max-height: 100%;
    object-fit: contain; border-radius: 13px;
  }
  .hint {
    text-align: center; font-size: 0.75rem;
    color: rgba(255,255,255,0.5); padding: 0.25rem 1rem 0.4rem;
  }
  .cat-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 0.35rem; padding: 0 0.9rem 0.5rem;
  }
  .cat-grid button {
    padding: 0.65rem 0.15rem; border-radius: 12px;
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.12);
    color: #fff; font-size: 0.75rem; font-weight: 600;
  }
  .cat-grid button.selected {
    background: #4ade80; color: #062; border-color: transparent;
  }
  .modal-bottom {
    padding: 0.4rem 1rem 1rem;
  }
  .modal-bottom button {
    width: 100%; height: 52px; border-radius: 13px; border: none;
    background: linear-gradient(135deg, #4ade80, #22c55e);
    color: #04210f; font-size: 1.05rem; font-weight: 700;
  }

  /* Theme / New Set Modal */
  .theme-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
    padding: 0.5rem 1rem 1rem;
  }
  .theme-card {
    padding: 1.1rem 0.7rem;
    border-radius: 14px;
    background: rgba(255,255,255,0.08);
    border: 1.5px solid rgba(255,255,255,0.12);
    text-align: center;
    font-weight: 700;
    font-size: 0.95rem;
  }
  .theme-card:active { transform: scale(0.97); }
  .theme-card .emoji { font-size: 1.6rem; display: block; margin-bottom: 0.35rem; }
  .theme-card.classic { border-color: #d4a373; }
  .theme-card.sport   { border-color: #4ade80; }
  .theme-card.elegant { border-color: #c084fc; }
  .theme-card.casual  { border-color: #60a5fa; }
  .theme-card.color   { border-color: #f472b6; }
  .theme-card.empty   { border-color: rgba(255,255,255,0.25); }

  .parts-list {
    flex: 1; overflow-y: auto; padding: 0.4rem 1rem;
  }
  .part-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.8rem 0.85rem;
    margin-bottom: 0.35rem;
    background: rgba(255,255,255,0.07);
    border-radius: 12px;
    border: 1.5px solid rgba(255,255,255,0.1);
  }
  .part-item.on {
    border-color: #4ade80;
    background: rgba(74,222,128,0.12);
  }
  .part-item span { font-size: 0.92rem; font-weight: 600; }
  .part-item .toggle {
    width: 46px; height: 27px; border-radius: 14px;
    background: rgba(255,255,255,0.15);
    position: relative; border: none;
  }
  .part-item.on .toggle { background: #4ade80; }
  .part-item .toggle::after {
    content: '';
    position: absolute; top: 3px; left: 3px;
    width: 21px; height: 21px; border-radius: 50%;
    background: #fff; transition: transform 0.15s;
  }
  .part-item.on .toggle::after { transform: translateX(19px); }
</style>
</head>
<body>
<input type="file" id="fileInput" accept="image/*" multiple style="display:none">

<div class="app">
  <div class="sets-wrapper" id="setsWrapper"></div>
  <div class="set-dots" id="setDots"></div>

  <div class="closet">
    <div class="closet-header">
      <div class="closet-title">KLEIDERSCHRANK</div>
      <div class="closet-actions">
        <button id="btn-parts" class="blue">Teile</button>
        <button id="btn-new-set" class="purple">+ Set</button>
        <button id="btn-add" class="green">+ Foto</button>
      </div>
    </div>
    <div class="cat-tabs" id="catTabs"></div>
    <div class="items-row" id="closetRow"></div>
  </div>
</div>

<!-- Add Modal -->
<div class="modal" id="modal">
  <div class="modal-header">
    <button id="btn-cancel">Abbrechen</button>
    <h3>Kategorie wählen</h3>
    <div style="width:80px"></div>
  </div>
  <div class="batch-info" id="batchInfo" style="display:none"></div>
  <div class="preview-area"><img id="previewImg" alt=""></div>
  <div class="hint">Was ist das für ein Kleidungsstück?</div>
  <div class="cat-grid" id="catGrid"></div>
  <div class="modal-bottom"><button id="btn-save">Speichern</button></div>
</div>

<!-- Neues Set Modal -->
<div class="modal" id="newSetModal">
  <div class="modal-header">
    <button id="btn-newset-cancel">Abbrechen</button>
    <h3>Neues Outfit-Set</h3>
    <div style="width:80px"></div>
  </div>
  <div class="hint">Wähle einen Stil – das Set wird danach gespeichert</div>
  <div class="theme-grid" id="themeGrid"></div>
</div>

<!-- Teile Modal -->
<div class="modal" id="partsModal">
  <div class="modal-header">
    <button id="btn-parts-cancel">Fertig</button>
    <h3>Teile für dieses Set</h3>
    <div style="width:70px"></div>
  </div>
  <div class="hint">Welche Kleidungsstücke sollen in diesem Outfit sichtbar sein?</div>
  <div class="parts-list" id="partsList"></div>
</div>

<script>
const CATEGORIES = {
  jacke:    { emoji: '🧥', label: 'Jacke/Mantel', slot: 'jacke' },
  bluse:    { emoji: '👚', label: 'Bluse/Hemd',   slot: 'bluse' },
  pullover: { emoji: '🧶', label: 'Pullover',     slot: 'bluse' },
  tshirt:   { emoji: '👕', label: 'T-Shirt',      slot: 'bluse' },
  gurtel:   { emoji: '🎗️', label: 'Gürtel',       slot: 'gurtel' },
  hose:     { emoji: '👖', label: 'Hose/Jeans',   slot: 'hose' },
  rock:     { emoji: '👗', label: 'Rock',         slot: 'hose' },
  shorts:   { emoji: '🩳', label: 'Shorts',       slot: 'hose' },
  tasche:   { emoji: '👜', label: 'Tasche',       slot: 'tasche' },
  schuhe:   { emoji: '👟', label: 'Schuhe',       slot: 'schuhe' },
};

const ALL_SLOTS = ['jacke', 'bluse', 'gurtel', 'hose', 'tasche', 'schuhe'];
const SLOT_TO_CATS = {
  jacke:  ['jacke'],
  bluse:  ['bluse', 'pullover', 'tshirt'],
  gurtel: ['gurtel'],
  hose:   ['hose', 'rock', 'shorts'],
  tasche: ['tasche'],
  schuhe:  ['schuhe'],
};
const SLOT_LABELS = {
  jacke:  'Jacke / Mantel',
  bluse:  'Bluse / Hemd',
  gurtel: 'Gürtel',
  hose:   'Hose / Jeans / Rock',
  tasche: 'Tasche',
  schuhe:  'Schuhe',
};

const THEMES = {
  classic: { emoji: '👔', label: 'Klassisch', slots: ['jacke','bluse','gurtel','hose','schuhe'], color: '#d4a373' },
  sport:   { emoji: '🏃', label: 'Sportlich', slots: ['bluse','hose','schuhe','tasche'], color: '#4ade80' },
  elegant: { emoji: '✨', label: 'Elegant',  slots: ['bluse','gurtel','hose','tasche','schuhe'], color: '#c084fc' },
  casual:  { emoji: '👟', label: 'Casual',   slots: ['bluse','hose','tasche','schuhe'], color: '#60a5fa' },
  color:   { emoji: '🎨', label: 'Farbe',    slots: ['bluse','hose','tasche','schuhe'], color: '#f472b6' },
  empty:   { emoji: '➕', label: 'Leer',     slots: ['bluse','hose'], color: '#94a3b8' },
};

const WARDROBE_KEY = 'ob_w_v12';
const SETS_KEY     = 'ob_s_v12';
const MAX_ITEMS    = 14;

let wardrobe = [];
let sets = [];
let activeSetIndex = 0;
let activeFilter = null;
let pendingImages = [];
let pendingIndex = 0;
let pendingCategory = 'bluse';

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return fallback;
}
function saveWardrobe() {
  if (wardrobe.length > MAX_ITEMS) wardrobe = wardrobe.slice(-MAX_ITEMS);
  for (let i = 0; i < 8; i++) {
    try {
      localStorage.setItem(WARDROBE_KEY, JSON.stringify(wardrobe));
      return true;
    } catch (e) {
      if (wardrobe.length <= 1) { wardrobe = []; return false; }
      wardrobe.shift();
    }
  }
  return false;
}
function saveSets() {
  try { localStorage.setItem(SETS_KEY, JSON.stringify(sets)); } catch (e) {}
}

function createEmptySet(themeKey = 'empty') {
  const theme = THEMES[themeKey] || THEMES.empty;
  return {
    id: 'set_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
    name: theme.label + ' Outfit',
    theme: themeKey,
    indices: { jacke:0, bluse:0, gurtel:0, hose:0, tasche:0, schuhe:0 },
    activeSlots: [...theme.slots]
  };
}

function compressImage(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = function(ev) {
      const img = new Image();
      img.onload = function() {
        const maxSize = 400;
        let w = img.width, h = img.height;
        if (w > maxSize || h > maxSize) {
          if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
          else { w = Math.round(w * maxSize / h); h = maxSize; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.45));
      };
      img.onerror = () => resolve(null);
      img.src = ev.target.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

const setsWrapper = document.getElementById('setsWrapper');
const setDots     = document.getElementById('setDots');
const catTabs     = document.getElementById('catTabs');
const closetRow   = document.getElementById('closetRow');
const modal       = document.getElementById('modal');
const newSetModal = document.getElementById('newSetModal');
const partsModal  = document.getElementById('partsModal');
const previewImg  = document.getElementById('previewImg');
const catGrid     = document.getElementById('catGrid');
const batchInfo   = document.getElementById('batchInfo');
const fileInput   = document.getElementById('fileInput');
const btnSave     = document.getElementById('btn-save');
const partsList   = document.getElementById('partsList');
const themeGrid   = document.getElementById('themeGrid');

wardrobe = loadJSON(WARDROBE_KEY, []);
sets = loadJSON(SETS_KEY, [createEmptySet('classic')]);
if (!sets.length) { sets = [createEmptySet('classic')]; saveSets(); }
sets.forEach(s => {
  if (!s.activeSlots) s.activeSlots = [...ALL_SLOTS];
  if (!s.theme) s.theme = 'empty';
  if (!s.name) s.name = 'Outfit';
});

/* ===== DYNAMISCHES LAYOUT ===== */
function buildSlotsHTML(activeSlots) {
  const has = (s) => activeSlots.includes(s);
  let html = '<div class="slots-container">';

  const topSlots = [];
  if (has('jacke')) topSlots.push('jacke');
  if (has('bluse')) topSlots.push('bluse');

  if (topSlots.length === 2) {
    html += `<div class="row flex-2">
      <div class="slot flex-1" data-slot="jacke">
        <div class="label">${SLOT_LABELS.jacke}</div>
        <div class="placeholder">${SLOT_LABELS.jacke}</div>
        <div class="slot-arrows"><button class="prev">‹</button><button class="next">›</button></div>
      </div>
      <div class="slot flex-2" data-slot="bluse">
        <div class="label">${SLOT_LABELS.bluse}</div>
        <div class="placeholder">${SLOT_LABELS.bluse}</div>
        <div class="slot-arrows"><button class="prev">‹</button><button class="next">›</button></div>
      </div>
    </div>`;
  } else if (topSlots.length === 1) {
    const s = topSlots[0];
    html += `<div class="row flex-2">
      <div class="slot flex-1" data-slot="${s}">
        <div class="label">${SLOT_LABELS[s]}</div>
        <div class="placeholder">${SLOT_LABELS[s]}</div>
        <div class="slot-arrows"><button class="prev">‹</button><button class="next">›</button></div>
      </div>
    </div>`;
  }

  if (has('gurtel')) {
    html += `<div class="row" style="flex:0 0 auto;">
      <div class="slot thin" data-slot="gurtel" style="width:100%">
        <div class="label">${SLOT_LABELS.gurtel}</div>
        <div class="placeholder">${SLOT_LABELS.gurtel}</div>
        <div class="slot-arrows"><button class="prev">‹</button><button class="next">›</button></div>
      </div>
    </div>`;
  }

  if (has('hose')) {
    html += `<div class="row flex-3">
      <div class="slot flex-1" data-slot="hose">
        <div class="label">${SLOT_LABELS.hose}</div>
        <div class="placeholder">${SLOT_LABELS.hose}</div>
        <div class="slot-arrows"><button class="prev">‹</button><button class="next">›</button></div>
      </div>
    </div>`;
  }

  const bottomSlots = [];
  if (has('tasche')) bottomSlots.push('tasche');
  if (has('schuhe')) bottomSlots.push('schuhe');

  if (bottomSlots.length === 2) {
    html += `<div class="row flex-1">
      <div class="slot flex-1" data-slot="tasche">
        <div class="label">${SLOT_LABELS.tasche}</div>
        <div class="placeholder">${SLOT_LABELS.tasche}</div>
        <div class="slot-arrows"><button class="prev">‹</button><button class="next">›</button></div>
      </div>
      <div class="slot flex-1" data-slot="schuhe">
        <div class="label">${SLOT_LABELS.schuhe}</div>
        <div class="placeholder">${SLOT_LABELS.schuhe}</div>
        <div class="slot-arrows"><button class="prev">‹</button><button class="next">›</button></div>
      </div>
    </div>`;
  } else if (bottomSlots.length === 1) {
    const s = bottomSlots[0];
    html += `<div class="row flex-1">
      <div class="slot flex-1" data-slot="${s}">
        <div class="label">${SLOT_LABELS[s]}</div>
        <div class="placeholder">${SLOT_LABELS[s]}</div>
        <div class="slot-arrows"><button class="prev">‹</button><button class="next">›</button></div>
      </div>
    </div>`;
  }

  html += '</div>';
  return html;
}

function renderSets() {
  setsWrapper.innerHTML = '';
  setDots.innerHTML = '';

  sets.forEach((set, idx) => {
    if (!set.activeSlots) set.activeSlots = [...ALL_SLOTS];

    const page = document.createElement('div');
    page.className = 'set-page';
    page.dataset.index = idx;

    const theme = THEMES[set.theme] || THEMES.empty;
    page.innerHTML = `
      <div class="set-header">
        <div class="set-name">${set.name || 'Outfit'}</div>
        <div class="set-theme" style="border:1px solid ${theme.color}55; color:${theme.color}">
          ${theme.emoji} ${theme.label}
        </div>
      </div>
      ${buildSlotsHTML(set.activeSlots)}
    `;

    setsWrapper.appendChild(page);
    fillSlots(page, set);
    page.querySelectorAll('.slot').forEach(slotEl => setupSlot(slotEl, idx));

    const dot = document.createElement('div');
    dot.className = 'dot' + (idx === activeSetIndex ? ' active' : '');
    setDots.appendChild(dot);
  });

  requestAnimationFrame(() => {
    setsWrapper.scrollLeft = activeSetIndex * (setsWrapper.clientWidth || 1);
  });
}

function fillSlots(page, set) {
  page.querySelectorAll('.slot').forEach(slotEl => {
    const slotName = slotEl.dataset.slot;
    const cats = SLOT_TO_CATS[slotName] || [];
    const items = wardrobe.filter(w => cats.includes(w.category));

    const oldImg = slotEl.querySelector('img');
    const oldPh = slotEl.querySelector('.placeholder');
    if (oldImg) oldImg.remove();
    if (oldPh) oldPh.remove();

    if (items.length === 0) {
      const ph = document.createElement('div');
      ph.className = 'placeholder';
      ph.textContent = SLOT_LABELS[slotName] || slotName;
      slotEl.appendChild(ph);
      return;
    }

    let idx = set.indices[slotName] || 0;
    if (idx < 0 || idx >= items.length) idx = 0;
    set.indices[slotName] = idx;

    const img = document.createElement('img');
    img.src = items[idx].img;
    slotEl.appendChild(img);
  });
}

function setupSlot(slotEl, setIdx) {
  const slotName = slotEl.dataset.slot;
  let startX = 0, longTimer = null, longPressed = false;

  slotEl.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.slot-arrows')) return;
    startX = e.clientX;
    longPressed = false;
    longTimer = setTimeout(() => {
      longPressed = true;
      sets[setIdx].indices[slotName] = 0;
      saveSets();
      renderSets();
      if (navigator.vibrate) navigator.vibrate(25);
    }, 600);
    try { slotEl.setPointerCapture(e.pointerId); } catch(e) {}
  });

  slotEl.addEventListener('pointerup', (e) => {
    clearTimeout(longTimer);
    if (longPressed) return;
    const dx = e.clientX - startX;
    if (Math.abs(dx) > 40) {
      changeVariant(setIdx, slotName, dx > 0 ? 1 : -1);
      return;
    }
    document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
    slotEl.classList.add('active');
    activeSetIndex = setIdx;
  });

  slotEl.addEventListener('pointercancel', () => clearTimeout(longTimer));

  const prevBtn = slotEl.querySelector('.prev');
  const nextBtn = slotEl.querySelector('.next');
  if (prevBtn) prevBtn.onclick = (e) => { e.stopPropagation(); changeVariant(setIdx, slotName, -1); };
  if (nextBtn) nextBtn.onclick = (e) => { e.stopPropagation(); changeVariant(setIdx, slotName, 1); };
}

function changeVariant(setIdx, slotName, dir) {
  const set = sets[setIdx];
  if (!set) return;
  const cats = SLOT_TO_CATS[slotName] || [];
  const items = wardrobe.filter(w => cats.includes(w.category));
  if (items.length < 2) return;

  let idx = (set.indices[slotName] || 0) + dir;
  idx = (idx + items.length) % items.length;
  set.indices[slotName] = idx;
  saveSets();
  renderSets();

  requestAnimationFrame(() => {
    const page = setsWrapper.querySelector(`.set-page[data-index="${setIdx}"]`);
    if (!page) return;
    const slot = page.querySelector(`.slot[data-slot="${slotName}"]`);
    if (slot) {
      document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
      slot.classList.add('active');
    }
  });
}

setsWrapper.addEventListener('scroll', () => {
  clearTimeout(setsWrapper._timer);
  setsWrapper._timer = setTimeout(() => {
    const w = setsWrapper.clientWidth || 1;
    activeSetIndex = Math.round(setsWrapper.scrollLeft / w);
    if (activeSetIndex < 0) activeSetIndex = 0;
    if (activeSetIndex >= sets.length) activeSetIndex = sets.length - 1;
    setDots.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === activeSetIndex));
  }, 60);
});

/* ===== NEUES SET MIT THEMA ===== */
function openNewSetModal() {
  themeGrid.innerHTML = '';
  Object.entries(THEMES).forEach(([key, t]) => {
    const card = document.createElement('div');
    card.className = 'theme-card ' + key;
    card.innerHTML = `<span class="emoji">${t.emoji}</span>${t.label}`;
    card.onclick = () => {
      const newSet = createEmptySet(key);
      sets.push(newSet);
      saveSets();
      activeSetIndex = sets.length - 1;
      newSetModal.classList.remove('open');
      renderSets();
      setTimeout(() => {
        setsWrapper.scrollTo({
          left: activeSetIndex * setsWrapper.clientWidth,
          behavior: 'smooth'
        });
      }, 50);
    };
    themeGrid.appendChild(card);
  });
  newSetModal.classList.add('open');
}

document.getElementById('btn-new-set').onclick = openNewSetModal;
document.getElementById('btn-newset-cancel').onclick = () => newSetModal.classList.remove('open');

/* ===== TEILE ===== */
function openPartsModal() {
  const set = sets[activeSetIndex];
  if (!set.activeSlots) set.activeSlots = [...ALL_SLOTS];

  partsList.innerHTML = '';
  ALL_SLOTS.forEach(slot => {
    const isOn = set.activeSlots.includes(slot);
    const el = document.createElement('div');
    el.className = 'part-item' + (isOn ? ' on' : '');
    el.innerHTML = `<span>${SLOT_LABELS[slot]}</span><button class="toggle"></button>`;
    el.onclick = () => {
      const idx = set.activeSlots.indexOf(slot);
      if (idx >= 0) {
        if (set.activeSlots.length <= 1) return;
        set.activeSlots.splice(idx, 1);
      } else {
        set.activeSlots.push(slot);
      }
      set.activeSlots.sort((a, b) => ALL_SLOTS.indexOf(a) - ALL_SLOTS.indexOf(b));
      saveSets();
      openPartsModal();
    };
    partsList.appendChild(el);
  });
  partsModal.classList.add('open');
}

document.getElementById('btn-parts').onclick = openPartsModal;
document.getElementById('btn-parts-cancel').onclick = () => {
  partsModal.classList.remove('open');
  renderSets();
};

/* ===== KLEIDERSCHRANK ===== */
function renderTabs() {
  catTabs.innerHTML = '';
  const order = ['bluse','hose','jacke','gurtel','tasche','schuhe','rock','pullover','tshirt','shorts'];
  order.forEach(key => {
    if (!CATEGORIES[key]) return;
    const btn = document.createElement('button');
    btn.className = 'cat-tab' + (activeFilter === key ? ' active' : '');
    const short = CATEGORIES[key].label.split('/')[0].split(' ')[0];
    btn.textContent = CATEGORIES[key].emoji + ' ' + short;
    btn.onclick = () => {
      activeFilter = (activeFilter === key) ? null : key;
      renderTabs();
      renderCloset();
    };
    catTabs.appendChild(btn);
  });
}

function renderCloset() {
  closetRow.innerHTML = '';
  const addBtn = document.createElement('div');
  addBtn.className = 'add-thumb';
  addBtn.textContent = '+';
  addBtn.onclick = startAdd;
  closetRow.appendChild(addBtn);

  let list = wardrobe;
  if (activeFilter) list = wardrobe.filter(w => w.category === activeFilter);

  list.forEach(item => {
    const el = document.createElement('div');
    el.className = 'thumb';
    const img = document.createElement('img');
    img.src = item.img;
    el.appendChild(img);

    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '×';
    del.onclick = (e) => {
      e.stopPropagation();
      if (confirm('Dieses Bild löschen?')) {
        wardrobe = wardrobe.filter(w => w.id !== item.id);
        saveWardrobe();
        renderSets();
        renderCloset();
      }
    };
    el.appendChild(del);

    el.onclick = () => {
      const slot = CATEGORIES[item.category]?.slot;
      if (!slot) return;
      const cats = SLOT_TO_CATS[slot] || [];
      const items = wardrobe.filter(w => cats.includes(w.category));
      const idx = items.findIndex(i => i.id === item.id);
      if (idx >= 0) {
        sets[activeSetIndex].indices[slot] = idx;
        if (!sets[activeSetIndex].activeSlots.includes(slot)) {
          sets[activeSetIndex].activeSlots.push(slot);
          sets[activeSetIndex].activeSlots.sort((a,b) => ALL_SLOTS.indexOf(a)-ALL_SLOTS.indexOf(b));
        }
        saveSets();
        renderSets();
      }
    };
    closetRow.appendChild(el);
  });
}

function startAdd() {
  fileInput.value = '';
  fileInput.click();
}

fileInput.addEventListener('change', async function(e) {
  const files = Array.from(e.target.files || []);
  if (!files.length) return;

  btnSave.disabled = true;
  btnSave.textContent = 'Lädt...';

  pendingImages = [];
  for (const file of files) {
    const compressed = await compressImage(file);
    if (compressed) pendingImages.push(compressed);
  }

  btnSave.disabled = false;
  btnSave.textContent = 'Speichern';
  if (!pendingImages.length) return;

  pendingIndex = 0;
  pendingCategory = activeFilter || 'bluse';
  showCurrentPending();
  modal.classList.add('open');
});

function showCurrentPending() {
  if (pendingIndex >= pendingImages.length) {
    modal.classList.remove('open');
    pendingImages = [];
    pendingIndex = 0;
    renderSets();
    renderCloset();
    return;
  }
  previewImg.src = pendingImages[pendingIndex];
  if (pendingImages.length > 1) {
    batchInfo.style.display = 'block';
    batchInfo.textContent = `Bild ${pendingIndex + 1} von ${pendingImages.length}`;
  } else {
    batchInfo.style.display = 'none';
  }
  renderCatGrid();
}

function renderCatGrid() {
  catGrid.innerHTML = '';
  Object.keys(CATEGORIES).forEach(key => {
    const val = CATEGORIES[key];
    const btn = document.createElement('button');
    btn.textContent = val.emoji + ' ' + val.label;
    if (key === pendingCategory) btn.classList.add('selected');
    btn.onclick = () => { pendingCategory = key; renderCatGrid(); };
    catGrid.appendChild(btn);
  });
}

btnSave.addEventListener('click', function() {
  if (!pendingImages[pendingIndex]) return;

  const newItem = {
    id: 'w_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
    img: pendingImages[pendingIndex],
    category: pendingCategory
  };
  wardrobe.push(newItem);
  saveWardrobe();

  const slot = CATEGORIES[pendingCategory].slot;
  const cats = SLOT_TO_CATS[slot] || [];
  const itemsInSlot = wardrobe.filter(w => cats.includes(w.category));
  sets[activeSetIndex].indices[slot] = Math.max(0, itemsInSlot.length - 1);

  if (!sets[activeSetIndex].activeSlots.includes(slot)) {
    sets[activeSetIndex].activeSlots.push(slot);
    sets[activeSetIndex].activeSlots.sort((a,b) => ALL_SLOTS.indexOf(a)-ALL_SLOTS.indexOf(b));
  }
  saveSets();

  pendingIndex++;
  showCurrentPending();
});

document.getElementById('btn-cancel').onclick = () => {
  modal.classList.remove('open');
  pendingImages = [];
  pendingIndex = 0;
};

document.getElementById('btn-add').onclick = startAdd;

renderSets();
renderTabs();
renderCloset();
window.addEventListener('resize', () => renderSets());
</script>
